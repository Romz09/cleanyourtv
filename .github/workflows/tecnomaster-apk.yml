name: Tecnomaster APK
on:
  push:
    branches: [tecnomaster-apple-tv]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Tecnomaster-Apple-TV
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
