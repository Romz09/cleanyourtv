name: Theme selector build
on:
  push:
    branches: [feature/theme-selector]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and test
        working-directory: launcher
        run: gradle --no-daemon -PlauncherApplicationId=com.gathin.tvhome.themes :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: theme-selector-independent
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
